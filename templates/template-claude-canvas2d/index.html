<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Claude Animation Base 2D Mascot</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0f172a; color: #fff; }
    #canvas-container { position: relative; width: 1920px; height: 1080px; }
    canvas { display: block; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <div id="canvas-container" data-composition-id="main">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Mascot state
    const mascot = {
      x: 960,
      y: 600,
      scaleX: 1,
      scaleY: 1,
      eyeOpen: 1,
      armAngle: 0,
      glow: 0.5,
      time: 0
    };

    function drawScene(t) {
      ctx.clearRect(0, 0, 1920, 1080);

      // Deep atmospheric background gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 1920, 1080);
      bgGrad.addColorStop(0, "#090d16");
      bgGrad.addColorStop(1, "#1e1b4b");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1920, 1080);

      // Draw subtle warm ground horizon
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(960, 900, 800, 180, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(30, 27, 75, 0.6)";
      ctx.fill();
      ctx.restore();

      // Hand-drawn Line boil effect
      const boilX = Math.sin(t * 12) * 1.5;
      const boilY = Math.cos(t * 14) * 1.5;

      ctx.save();
      ctx.translate(mascot.x + boilX, mascot.y + boilY);
      ctx.scale(mascot.scaleX, mascot.scaleY);

      // Shadow
      ctx.beginPath();
      ctx.ellipse(0, 120, 140 * mascot.scaleX, 28, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fill();

      // Character Torso (Warm terracotta gouache wash)
      ctx.beginPath();
      ctx.roundRect(-90, -80, 180, 190, [40, 40, 60, 60]);
      ctx.fillStyle = "#e06c53";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#292524";
      ctx.stroke();

      // Character Head
      ctx.beginPath();
      ctx.arc(0, -130, 85, 0, Math.PI * 2);
      ctx.fillStyle = "#f4a261";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#292524";
      ctx.stroke();

      // Expressive Mascot Eyes
      const eyeH = 18 * mascot.eyeOpen;
      ctx.fillStyle = "#1c1917";
      // Left Eye
      ctx.beginPath();
      ctx.ellipse(-32, -135, 12, Math.max(1, eyeH), 0, 0, Math.PI * 2);
      ctx.fill();
      // Right Eye
      ctx.beginPath();
      ctx.ellipse(32, -135, 12, Math.max(1, eyeH), 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye catchlights
      if (mascot.eyeOpen > 0.4) {
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-29, -139, 4, 0, Math.PI * 2);
        ctx.arc(35, -139, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Cheerful Rosy Cheeks
      ctx.fillStyle = "rgba(239, 68, 68, 0.45)";
      ctx.beginPath();
      ctx.arc(-48, -118, 14, 0, Math.PI * 2);
      ctx.arc(48, -118, 14, 0, Math.PI * 2);
      ctx.fill();

      // Waving Arm
      ctx.save();
      ctx.translate(85, -40);
      ctx.rotate(mascot.armAngle);
      ctx.beginPath();
      ctx.roundRect(0, -14, 80, 28, 14);
      ctx.fillStyle = "#e06c53";
      ctx.fill();
      ctx.strokeStyle = "#292524";
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.restore();

      ctx.restore();

      // Typography overlay
      ctx.save();
      ctx.font = "bold 52px system-ui, -apple-system, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.fillText("CLAUDE ANIMATION BASE", 960, 200);
      ctx.font = "600 24px monospace";
      ctx.fillStyle = "#38bdf8";
      ctx.fillText("HAND-PAINTED 2D MASCOT & CHARACTER GRAMMAR", 960, 250);
      ctx.restore();
    }

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // Mascot animations
    tl.fromTo(mascot, { y: 800, scaleX: 0.8, scaleY: 1.2 }, { y: 600, scaleX: 1, scaleY: 1, duration: 1.0, ease: "bounce.out" }, 0)
      .to(mascot, { armAngle: -0.8, duration: 0.4, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0.8)
      .to(mascot, { eyeOpen: 0.05, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, 1.5)
      .to(mascot, { eyeOpen: 0.05, duration: 0.1, yoyo: true, repeat: 1, ease: "power2.inOut" }, 4.0)
      .to(mascot, { scaleX: 1.15, scaleY: 0.88, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut" }, 2.5);

    window.seekFrame = function(t) {
      mascot.time = t;
      drawScene(t);
    };

    drawScene(0);
  </script>
</body>
</html>
