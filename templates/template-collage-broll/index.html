<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Collage B-roll Paper Stop-Motion</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Courier New", Courier, monospace; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #e8dcc4; color: #1c1917; }
    #board { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

    /* Paper cutout elements */
    .paper-sheet {
      position: absolute; top: 120px; left: 160px; width: 800px; height: 840px;
      background: #fdfbf7;
      box-shadow: 12px 18px 40px rgba(0,0,0,0.18);
      border: 1px solid #d6cfbf;
      padding: 60px;
      transform: rotate(-2deg);
    }

    .halftone-photo {
      position: absolute; top: 180px; right: 200px; width: 680px; height: 720px;
      background: #292524;
      border: 8px solid #fff;
      box-shadow: 16px 24px 50px rgba(0,0,0,0.22);
      transform: rotate(3deg);
      display: flex; align-items: center; justify-content: center;
      color: #fafaf9; font-size: 24px; text-align: center;
      background-image: radial-gradient(#44403c 20%, transparent 20%);
      background-size: 8px 8px;
    }

    .tape {
      position: absolute; width: 160px; height: 44px;
      background: rgba(254, 240, 138, 0.7);
      border: 1px dashed rgba(202, 138, 4, 0.4);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 10;
    }

    .headline { font-size: 56px; font-weight: 900; line-height: 1.1; text-transform: uppercase; margin-bottom: 24px; }
    .stamp { display: inline-block; padding: 8px 18px; border: 3px solid #dc2626; color: #dc2626; font-size: 28px; font-weight: 900; transform: rotate(-8deg); text-transform: uppercase; margin-top: 30px; }
    .metaphor-badge { font-size: 20px; font-weight: 700; background: #000; color: #fff; padding: 6px 14px; width: fit-content; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="board" data-composition-id="main">
    <div class="tape" style="top: 100px; left: 480px; transform: rotate(-5deg);"></div>
    <div class="tape" style="top: 160px; right: 300px; transform: rotate(12deg);"></div>

    <div class="paper-sheet">
      <div class="metaphor-badge">VISUAL METAPHOR #01</div>
      <div class="headline">COGNITIVE OVERLOAD</div>
      <p style="font-size: 22px; line-height: 1.6; color: #44403c;">
        When 50 competing priorities assault the prefrontal cortex simultaneously, the working memory reaches total saturation.
      </p>
      <div class="stamp">PARALYZED</div>
    </div>

    <div class="halftone-photo">
      <div>
        <div style="font-size: 72px; margin-bottom: 16px;">⏱️ ⏳ 📚</div>
        <div style="font-weight: 800; font-size: 32px; letter-spacing: 2px;">THE TYRANNY OF NOW</div>
        <div style="font-size: 18px; color: #a8a29e; margin-top: 10px;">MONOCHROME HALFTONE EDITORIAL</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // 12 FPS Stop-motion stepped animation
    tl.from(".paper-sheet", { y: -80, opacity: 0, duration: 0.6, ease: "steps(4)" }, 0.2)
      .from(".halftone-photo", { scale: 0.8, opacity: 0, duration: 0.6, ease: "steps(4)" }, 0.5)
      .from(".tape", { opacity: 0, scaleY: 0, duration: 0.3, stagger: 0.15, ease: "steps(2)" }, 0.8)
      .from(".stamp", { scale: 2.5, opacity: 0, duration: 0.3, ease: "power4.out" }, 1.2)
      .to("#board", { x: "+=2", y: "-=2", duration: 0.08, repeat: -1, yoyo: true, ease: "none" }, 0);
  </script>
</body>
</html>
