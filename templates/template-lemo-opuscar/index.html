<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Lemo Opuscar Cinematic Film Style</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #030712; color: #fff; font-family: monospace; }
    #cinema { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute; inset: 0; z-index: 50; pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
    }

    /* Cinematic Perspective Grid */
    .grid-floor {
      position: absolute; bottom: -200px; left: -50%; width: 200%; height: 600px;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.25) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(600px) rotateX(75deg);
      transform-origin: top center;
    }

    /* Giant Neon Sun */
    .neon-sun {
      position: absolute; top: 220px; left: 50%; transform: translateX(-50%);
      width: 440px; height: 440px; border-radius: 50%;
      background: linear-gradient(180deg, #ff007f 0%, #ffaa00 100%);
      box-shadow: 0 0 100px #ff007f, 0 0 160px rgba(255, 0, 127, 0.5);
    }

    /* Silhouette Skyline */
    .skyline {
      position: absolute; bottom: 180px; left: 0; width: 100%; height: 260px;
      display: flex; align-items: flex-end; justify-content: center; gap: 8px;
    }
    .building { background: #060913; width: 50px; border-top: 2px solid #00f3ff; }

    /* HUD Typography */
    .hud-title {
      position: absolute; top: 100px; left: 100px; z-index: 40;
    }
    .hud-code { font-size: 18px; color: #00f3ff; letter-spacing: 4px; }
    .hud-header { font-size: 64px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 20px #00f3ff; }
  </style>
</head>
<body>
  <div id="cinema" data-composition-id="main">
    <div class="scanlines"></div>
    <div class="neon-sun"></div>
    <div class="grid-floor"></div>

    <div class="skyline">
      <div class="building" style="height: 120px; width: 80px;"></div>
      <div class="building" style="height: 220px; width: 60px;"></div>
      <div class="building" style="height: 180px; width: 100px;"></div>
      <div class="building" style="height: 250px; width: 70px;"></div>
      <div class="building" style="height: 140px; width: 90px;"></div>
      <div class="building" style="height: 200px; width: 110px;"></div>
      <div class="building" style="height: 260px; width: 75px;"></div>
      <div class="building" style="height: 170px; width: 85px;"></div>
      <div class="building" style="height: 230px; width: 95px;"></div>
      <div class="building" style="height: 150px; width: 70px;"></div>
    </div>

    <div class="hud-title">
      <div class="hud-code">// LEMO OPUSCAR · STYLE #02</div>
      <div class="hud-header">CYBERPUNK NEON NOIR</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // Timeline motion
    tl.from(".neon-sun", { scale: 0.5, y: 150, duration: 1.5, ease: "power3.out" }, 0)
      .from(".building", { scaleY: 0, stagger: 0.05, duration: 1.0, ease: "power4.out", transformOrigin: "bottom" }, 0.4)
      .from(".hud-title", { opacity: 0, x: -60, duration: 0.9, ease: "power2.out" }, 0.8)
      .to(".grid-floor", { backgroundPositionY: "+=360px", duration: 8, ease: "none" }, 0);
  </script>
</body>
</html>
