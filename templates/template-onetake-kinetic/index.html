<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>OneTake Kinetic Continuity</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff; }
    #camera {
      position: absolute; width: 1920px; height: 1080px;
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    #world {
      position: absolute; width: 100%; height: 100%;
      transform-style: preserve-3d;
    }

    /* Kinetic Hero typography */
    .kinetic-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 96px; font-weight: 900;
      letter-spacing: -4px; text-transform: uppercase;
      text-align: center;
      line-height: 0.95;
    }

    /* Morphing vector geometry */
    .morph-circle {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      border-radius: 50%;
      background: #00f3ff;
      box-shadow: 0 0 60px #00f3ff;
    }

    .hud-ring {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 500px;
      border: 2px dashed rgba(0, 243, 255, 0.4);
      border-radius: 50%;
    }

    .badge-sub {
      font-size: 24px; font-weight: 700; color: #00f3ff; letter-spacing: 6px;
      margin-top: 24px; opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="camera">
    <div id="world">
      <div class="hud-ring"></div>
      <div class="morph-circle"></div>
      <div class="kinetic-text">
        <div id="word1">UNBROKEN</div>
        <div id="word2" style="color: #00f3ff;">MOMENTUM</div>
        <div class="badge-sub">CONTINUOUS CAMERA TRACKING</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["main"] = tl;

    // OneTake Kinetic camera movement
    tl.fromTo(".morph-circle", 
        { scale: 0.1, opacity: 0 }, 
        { scale: 1, opacity: 1, duration: 1.2, ease: "cubic-bezier(0.16, 1, 0.3, 1)" }, 0)
      .fromTo("#word1", 
        { y: 100, opacity: 0, rotateX: 45 }, 
        { y: 0, opacity: 1, rotateX: 0, duration: 0.9, ease: "power4.out" }, 0.4)
      .fromTo("#word2", 
        { y: 100, opacity: 0, rotateX: 45 }, 
        { y: 0, opacity: 1, rotateX: 0, duration: 0.9, ease: "power4.out" }, 0.7)
      .to(".hud-ring", { rotate: 360, duration: 8, ease: "none" }, 0)
      .to("#world", {
        z: 400,
        rotateY: 15,
        rotateX: -10,
        duration: 5,
        ease: "power2.inOut",
        yoyo: true,
        repeat: 1
      }, 1.2);
  </script>
</body>
</html>
