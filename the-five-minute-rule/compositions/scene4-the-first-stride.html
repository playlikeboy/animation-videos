    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // Protagonist walk cycle: legs swinging back and forth
        tl.to('[data-composition-id="scene4"] #leg-left', { y: -12, x: 8, rotation: 10, transformOrigin: "top center", yoyo: true, repeat: 75, duration: 0.4 }, 0);
        tl.to('[data-composition-id="scene4"] #leg-right', { y: 12, x: -8, rotation: -10, transformOrigin: "top center", yoyo: true, repeat: 75, duration: 0.4 }, 0);
        tl.to('[data-composition-id="scene4"] #arm-left', { rotation: -14, transformOrigin: "top center", yoyo: true, repeat: 75, duration: 0.4 }, 0);
        tl.to('[data-composition-id="scene4"] #arm-right', { rotation: 14, transformOrigin: "top center", yoyo: true, repeat: 75, duration: 0.4 }, 0);

        // Torso subtle vertical bobbing
        tl.to('[data-composition-id="scene4"] #walker', { y: -6, yoyo: true, repeat: 150, duration: 0.2 }, 0);

        // Character slowly progresses forward along the perspective path
        tl.fromTo('[data-composition-id="scene4"] #walker', 
          { x: -50, scale: 0.95 }, 
          { x: 70, scale: 1.05, duration: 55, ease: "linear" }, 
          0
        );
        tl.fromTo('[data-composition-id="scene4"] #walker-shadow', 
          { x: -50, scale: 0.95 }, 
          { x: 70, scale: 1.05, duration: 55, ease: "linear" }, 
          0
        );

        // Timer counts up deterministically from 01:14 to 04:59
        const timerKeyframes = [
          { t: 0, str: "01:14" },
          { t: 8, str: "01:58" },
          { t: 16, str: "02:45" },
          { t: 26, str: "03:30" },
          { t: 38, str: "04:15" },
          { t: 50, str: "04:59" },
        ];
        timerKeyframes.forEach(({ t, str }) => {
          tl.call(() => {
            const el = document.querySelector('[data-composition-id="scene4"] #hud-timer');
            if (el) el.textContent = str;
          }, null, t);
        });

        // Subtitles & Voiceover sync
        tl.to('[data-composition-id="scene4"] #subtitle-s4', { opacity: 1, duration: 0.6 }, 2.0);
        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene4"] #subtitle-s4');
          if (sub) sub.textContent = "The first sixty seconds feel heavy. Your mind invents ten reasons to turn back.";
        }, null, 2.0);

        // Thought pops in
        tl.fromTo('[data-composition-id="scene4"] #thought-s4', 
          { opacity: 0, y: 15 }, 
          { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 
          4.0
        );
        tl.to('[data-composition-id="scene4"] #thought-s4', { opacity: 0, duration: 0.7 }, 10.0);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene4"] #subtitle-s4');
          if (sub) sub.textContent = "Yet with every stride down the quiet road, the resistance fades.";
        }, null, 7.5);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene4"] #subtitle-s4');
          if (sub) sub.textContent = "You aren't fighting the mountain anymore. You're just taking the next step.";
        }, null, 13.0);

        // Transition out
        tl.to('[data-composition-id="scene4"]', { opacity: 0, duration: 2.0 }, 57.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene4"] = tl;
      })();
