    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        // 0s - 3s: Alarm pulses, hand moves into frame towards snooze button
        tl.fromTo('[data-composition-id="scene1"] #hand', 
          { x: -140, y: 180, opacity: 0 }, 
          { x: 0, y: 0, opacity: 1, duration: 2.5, ease: "power2.out" }, 
          0.5
        );

        // Button snooze press interaction at 3s
        tl.to('[data-composition-id="scene1"] #btn-snooze', { scale: 0.94, backgroundColor: "#cbd5e1", duration: 0.15 }, 3.0);
        tl.to('[data-composition-id="scene1"] #btn-snooze', { scale: 1.0, backgroundColor: "#ffffff", duration: 0.2 }, 3.15);

        // Thought pops in at 3.4s
        tl.fromTo('[data-composition-id="scene1"] #thought-bubble', 
          { opacity: 0, y: 20 }, 
          { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.4)" }, 
          3.4
        );

        // Subtitles change to match voiceover
        tl.to('[data-composition-id="scene1"] #subtitle', { opacity: 1, duration: 0.6 }, 4.5);
        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene1"] #subtitle');
          if (sub) sub.textContent = "Every morning begins with a negotiation with yourself.";
        }, null, 4.5);

        // Hand slowly retracts
        tl.to('[data-composition-id="scene1"] #hand', { x: 40, y: 160, opacity: 0.6, duration: 3.5, ease: "power1.inOut" }, 4.0);

        // Camera zooms out gently from 7s, revealing calendar
        tl.to('[data-composition-id="scene1"] #phone-stage', { x: 180, scale: 0.85, duration: 6, ease: "power2.inOut" }, 7.0);
        tl.to('[data-composition-id="scene1"] #calendar-board', { opacity: 1, duration: 2 }, 8.0);

        // Days cross out sequentially in fast motion (representing lost days)
        for (let i = 1; i <= 28; i++) {
          tl.to(`[data-composition-id="scene1"] .cross-${i}`, { opacity: 0.9, scale: 1.2, duration: 0.1 }, 9.0 + (i * 0.18));
        }

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene1"] #subtitle');
          if (sub) sub.textContent = "You promised that today would be different. But when 5:30 arrives...";
        }, null, 10.0);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene1"] #subtitle');
          if (sub) sub.textContent = "The mountain feels too steep to climb. So you hit snooze.";
        }, null, 15.0);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene1"] #subtitle');
          if (sub) sub.textContent = "And the days slip quietly through your fingers.";
        }, null, 20.0);

        // Thought fades out cleanly before calendar appears
        tl.to('[data-composition-id="scene1"] #thought-bubble', { opacity: 0, y: -10, duration: 0.8 }, 7.0);

        // Fade down for transition to Scene 2 at end of minute
        tl.to('[data-composition-id="scene1"] #phone-stage, [data-composition-id="scene1"] #calendar-board, [data-composition-id="scene1"] #subtitle', { opacity: 0, duration: 2.5 }, 56.5);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1"] = tl;
      })();
