        const tl = gsap.timeline({ paused: true });

        // Camera starts wide, slow push in on slumped figure
        tl.fromTo('[data-composition-id="scene2"] #routine-wall', 
          { opacity: 0, y: -30 }, 
          { opacity: 1, y: 0, duration: 1.5, ease: "power2.out" },

        // Subtitles & Voiceover sync
        tl.to('[data-composition-id="scene2"] #subtitle-s2', { opacity: 1, duration: 0.8 }, 2.0);
        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene2"] #subtitle-s2');
          if (sub) sub.textContent = "We don't fail because we are lazy. We fail because our ambition is violent.";
        }, null, 2.0);

        // Thought pops in
        tl.fromTo('[data-composition-id="scene2"] #thought-s2', 
          { opacity: 0, scale: 0.9 }, 
          { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.2)" }, 
          4.0
        );

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene2"] #subtitle-s2');
          if (sub) sub.textContent = "We expect ourselves to cross the entire ocean in a single jump.";
        }, null, 7.5);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene2"] #subtitle-s2');
          if (sub) sub.textContent = "And because the jump feels impossible... we never even take the first step.";
        }, null, 13.0);

        // Focus camera zooms down toward untouched shoes & tag
        tl.to('[data-composition-id="scene2"] #routine-wall, [data-composition-id="scene2"] #thought-s2', { opacity: 0.2, y: -40, duration: 4 }, 15.0);

        // Transition to black
        tl.to('[data-composition-id="scene2"]', { opacity: 0, duration: 2 }, 57.0);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene2"] = tl;
