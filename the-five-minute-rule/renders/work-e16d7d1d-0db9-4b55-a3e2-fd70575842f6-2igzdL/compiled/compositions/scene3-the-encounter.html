        // Dialogue 1: "Hi. It's been a while."

          { opacity: 0, scale: 0.9 },

          2.5
        );
        tl.to('[data-composition-id="scene3"] #subtitle-s3', { opacity: 1, duration: 0.5 }, 2.5);

        // Dialogue 2: Protagonist speaks
        tl.to('[data-composition-id="scene3"] #dialogue-box', { opacity: 0, duration: 0.4 }, 8.0);
        tl.call(() => {

          const s = document.querySelector('[data-composition-id="scene3"] #subtitle-s3');
          if (d) d.textContent = "I couldn't do it. I haven't run even once.";
          if (s) s.textContent = '"I couldn\'t do it. I haven\'t run even once."';
        }, null, 8.5);
        tl.to('[data-composition-id="scene3"] #dialogue-box', { opacity: 1, duration: 0.6 }, 8.8);

        // Protagonist looks down in guilt
        tl.to('[data-composition-id="scene3"] #proto-eye-l, [data-composition-id="scene3"] #proto-eye-r', { y: 6, duration: 0.5 }, 8.8);

          const s = document.querySelector('[data-composition-id="scene3"] #subtitle-s3');
          if (d) d.textContent = "Forget the marathon. Can you just walk out your door for five minutes?";
          if (s) s.textContent = '"Forget the marathon. Can you just walk out your door for five minutes?"';
        }, null, 16.5);
        tl.to('[data-composition-id="scene3"] #dialogue-box', { opacity: 1, duration: 0.6 }, 16.8);

        // Protagonist eyes widen in astonishment
        tl.to('[data-composition-id="scene3"] #proto-eye-l, [data-composition-id="scene3"] #proto-eye-r', { y: 0, scaleY: 1.4, duration: 0.4 }, 18.0);

        tl.to('[data-composition-id="scene3"] #dialogue-box', { opacity: 0, duration: 0.4 }, 25.0);

        tl.to('[data-composition-id="scene3"] #dialogue-box', { opacity: 1, duration: 0.6 }, 25.8);
