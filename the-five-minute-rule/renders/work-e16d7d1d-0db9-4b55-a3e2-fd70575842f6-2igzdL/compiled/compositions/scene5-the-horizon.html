          if (sub) sub.textContent = "A mountain is not moved all at once; it is moved stone by stone.";
        }, null, 1.5);

        // Notebook card slides in
        tl.to('[data-composition-id="scene5"] #notebook-overlay', { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 4.0);
        tl.to('[data-composition-id="scene5"] #check-tick', { opacity: 1, scale: 1.2, duration: 0.4, ease: "back.out(2)" }, 5.5);

        tl.call(() => {
          const sub = document.querySelector('[data-composition-id="scene5"] #subtitle-s5');
          if (sub) sub.textContent = "You don't need endless motivation to change your life.";
        }, null, 6.5);

          const sub = document.querySelector('[data-composition-id="scene5"] #subtitle-s5');
          if (sub) sub.textContent = "You only need the courage to give yourself five minutes.";
        }, null, 11.0);

        tl.to('[data-composition-id="scene5"] #notebook-overlay, [data-composition-id="scene5"] #hud-pill-s5, [data-composition-id="scene5"] #subtitle-s5', { opacity: 0, duration: 2.5 }, 18.0);

          { opacity: 1, scale: 1.0, duration: 2.5, ease: "power2.out" },
